name: Eval

on:
  pull_request:
    branches: [main]

# The GITHUB_TOKEN scope is otherwise whatever the org default is -- a setting held
# outside this repo, not versioned with it, and changeable without a commit. A
# permissions block replaces the scope set rather than adding to it, so this reduces a
# write-capable token to a read-only one. Widen per job, never here.
permissions:
  contents: read

jobs:
  promptfoo:
    name: Prompt Security Evaluation
    runs-on: ubuntu-latest
    # The eval runs the agent here and grades it with a second model, both on Vertex AI,
    # so it logs in through Workload Identity Federation, like deploy.yml, with no key. It
    # logs in as the GitHub environment `eval`: its principal may only call models
    # (infra/agent/eval.tf). Not as `prod` or `dev`, whose reviewers would block every
    # pull request. `eval` has no required reviewers and no branch rule.
    environment: eval
    permissions:
      contents: read
      # Lets google-github-actions/auth request GitHub's OIDC token for WIF.
      id-token: write
    env:
      # The `eval` environment's variables: the project the eval's model calls run in and
      # are billed to (dev's, by default), and its region.
      GOOGLE_CLOUD_PROJECT: "{% raw %}${{ vars.GOOGLE_CLOUD_PROJECT }}{% endraw %}"
      GOOGLE_CLOUD_LOCATION: "{% raw %}${{ vars.GOOGLE_CLOUD_LOCATION }}{% endraw %}"
    steps:
      - uses: actions/checkout@v4

      # Keyless: the run's OIDC token is exchanged in the Workload Identity pool, and the
      # APIs see this repository in the `eval` environment as the caller. The agent and
      # the rubric grader both pick it up as Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "{% raw %}${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}{% endraw %}"
          project_id: "{% raw %}${{ vars.GOOGLE_CLOUD_PROJECT }}{% endraw %}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{cookiecutter.python_version}}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Run promptfoo evaluation
        # --ci isn't a recognized promptfoo eval flag (checked against current --help).
        # -o writes the output.json the next two steps read/upload. Deliberately not
        # relying on this step's own exit code — verified empirically that promptfoo exits
        # 0 even when every test case errors out (e.g. a bad API key), so pass/fail is
        # enforced explicitly in "Enforce evaluation results" below instead.
        # `uv run` matters here: promptfoo's python:provider.py provider spawns its own
        # Python worker to import tests/evals/provider.py, which needs this project's
        # deps (python-dotenv, google-adk, ...) from .venv. Without `uv run`, that worker
        # gets the bare system Python from actions/setup-python instead, which never had
        # `uv sync`'s deps installed — confirmed via a real CI run: every case failed with
        # `ModuleNotFoundError: No module named 'dotenv'`. `make eval`'s local path
        # (tests/evals/run_eval.py, invoked via `uv run python ...`) never hit this because
        # `uv run` already activates .venv for the whole subprocess tree it spawns.
        # Pinned rather than @latest: an unpinned npx resolves at run time, so a
        # promptfoo release can change eval results — or what executes — without a commit
        # here. Bump it deliberately and re-baseline the thresholds in promptfoo.yaml.
        run: uv run npx --yes promptfoo@0.123.1 eval --config tests/evals/promptfoo.yaml --no-progress-bar -j 2 -o output.json
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          # The ADK's OpenTelemetry instrumentation detaches a context token from a
          # different context than the one it was created in when driven from
          # promptfoo's async python worker, which raises
          # `ValueError: <Token ...> was created in a different Context` and can wedge
          # the worker until it hits promptfoo's 300s timeout. tests/evals/run_eval.py
          # already sets this for the local path; CI was missing it, so the eval was
          # flaky here and nowhere else.
          OTEL_SDK_DISABLED: "true"
          MODEL_PROVIDER: google
          # Gemini through Vertex AI and the credentials above. Without it google-genai
          # uses the AI Studio backend, which needs an API key. No API key is set here on
          # purpose: promptfoo's vertex: grader would send it to Vertex, which refuses it.
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"

      - name: Enforce evaluation results
        # promptfoo's own exit code doesn't reflect errors (only, maybe, assertion
        # failures). enforce.py reads output.json and fails on a grader that could not
        # run (reported as such, not as an agent failure), on any errored case, and on a
        # pass rate below promptfoo.yaml's threshold. `make eval` runs the same check.
        run: uv run python tests/evals/enforce.py output.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: output.json
          if-no-files-found: ignore
