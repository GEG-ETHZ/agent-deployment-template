name: Lint PR Title

# The commit-msg hook (commitizen) validates commit messages on the contributor's branch.
# A squash merge discards those and uses the PR title as the commit subject on main, so
# without this job the one string that reaches permanent history — and that `cz bump` reads
# to build CHANGELOG.md — is the only one nothing checks. The hook is also local, so it is
# bypassable with `--no-verify` or by committing through the GitHub web UI.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# amannn/action-semantic-pull-request reads the PR through the API, which needs
# pull-requests: read. New repositories default GITHUB_TOKEN to contents-only, so without
# this the job fails with "Resource not accessible by integration" — confirmed on a real
# run before this was added. Declaring permissions explicitly also drops every other scope,
# which is what a title check should have.
permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Check PR title format
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"
        with:
          # Exactly the set commitizen's cz_conventional_commits accepts. Keep the two in
          # step: a narrower list here would reject a PR title that the commit-msg hook had
          # already accepted as a commit message, which is a confusing place to disagree.
          types: |
            build
            bump
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false
