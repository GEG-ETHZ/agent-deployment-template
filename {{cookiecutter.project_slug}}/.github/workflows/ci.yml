name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The GITHUB_TOKEN scope is otherwise whatever the org default is -- a setting held
# outside this repo, not versioned with it, and changeable without a commit. A
# permissions block replaces the scope set rather than adding to it, so this reduces a
# write-capable token to a read-only one. Widen per job, never here.
permissions:
  contents: read

jobs:
  lint-format-typecheck:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{cookiecutter.python_version}}"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

  infra:
    name: OpenTofu fmt, validate & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      # Offline: no backend, mocked provider. Covers the agent's and CI's IAM grants.
      - name: OpenTofu checks
        run: make infra-test

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{cookiecutter.python_version}}"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Run unit tests
        # No coverage enforcement here — tests/unit alone was never meant to hit the
        # project-wide 75% bar on its own. The `coverage` job below checks that against
        # the full suite instead.
        run: uv run pytest tests/unit -v --no-cov

  integration-test:
    name: Integration tests (mocked LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{cookiecutter.python_version}}"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Run integration tests
        # No coverage enforcement here either — see the `test` job's comment above.
        run: uv run pytest tests/integration -v --tb=short --no-cov
        env:
          # Use Google provider so resolve_model() returns a plain string —
          # the Runner is mocked before any network call is made.
          MODEL_PROVIDER: google

  coverage:
    name: Coverage (full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "{{cookiecutter.python_version}}"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Run full test suite with coverage
        # Runs unit + integration together in one pytest invocation, so the project-wide
        # 75% coverage bar (pyproject.toml's --cov-fail-under=75) is checked against what
        # the two suites cover combined — neither one alone was ever meant to clear it.
        run: uv run pytest tests/unit tests/integration -v
        env:
          MODEL_PROVIDER: google

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: htmlcov/
