version: 2

# Monthly and grouped, so this is roughly one pull request per ecosystem per month rather
# than a drip of single-dependency PRs nobody reads. Security updates are not affected by
# the schedule: they still arrive as soon as an advisory is published.
#
# For pre-commit and uv only the template's own root is scanned. The generated layer under
# {{cookiecutter.project_slug}}/ cannot be: its pyproject.toml has Jinja in requires-python,
# so no parser can read it. Generated projects get their own dependabot.yml, shipped as a
# template file.
#
# GitHub Actions is the exception: the generated workflows are plain YAML, and every action
# in them is pinned to a commit SHA, which would otherwise never move. One entry keeps the
# pins in both layers current, so a newly generated project starts from current actions.
updates:
  # One entry, so one grouped pull request bumps both layers.
  # - "/" is the root: Dependabot scans `.github/workflows` and a root `action.yml` there.
  # - "/[^.]*/.github/workflows" is the template folder. A literal
  #   `{{cookiecutter.project_slug}}` path is refused, because Dependabot reads the braces
  #   as a glob pattern. `[^.]` keeps the glob from also matching the root: Dependabot
  #   expands globs with FNM_DOTMATCH, so a plain `*` would match `.` and list the root a
  #   second time as `/./.github/workflows`.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/[^.]*/.github/workflows"
    schedule:
      interval: monthly
    # Same hold as uv below: a bad release has seven days to be pulled before it is offered.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # GitHub already holds a new release for 3 days before offering it. Seven gives a bad
    # release time to be yanked before it reaches a pull request here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      # [project].dependencies is empty in this repo -- the template itself ships no
      # runtime dependencies -- so one group covers everything the lock file holds.
      dev-dependencies:
        patterns: ["*"]
